<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風嶺拍貼機 — 照片取件</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;200;300;400&display=swap">
    <style nonce="__CSP_NONCE__">
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #f5f5f0;
            overflow-x: hidden;
        }

        /* Corner bracket decoration */
        .frame-corner {
            position: absolute;
            width: 24px;
            height: 24px;
        }
        .frame-corner::before,
        .frame-corner::after {
            content: '';
            position: absolute;
            background: rgba(184, 197, 214, 0.45);
        }
        .frame-corner::before { width: 100%; height: 1px; top: 0; left: 0; }
        .frame-corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
        .frame-corner.tr { transform: rotate(90deg);  top: 0; right: 0; }
        .frame-corner.bl { transform: rotate(270deg); bottom: 0; left: 0; }
        .frame-corner.br { transform: rotate(180deg); bottom: 0; right: 0; }

        .vert-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.58rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(184, 197, 214, 0.6);
        }

        /* Photo wrap */
        .photo-wrap {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            min-height: 200px;
            background: rgba(43, 43, 43, 0.04);
        }

        /* Photo image — pointer-events: none so overlay intercepts all touches */
        .photo-img {
            width: 100%;
            display: block;
            border-radius: 4px;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            /* iOS Safari: disables the long-press "Save Image" callout */
            -webkit-touch-callout: none;
        }

        /* Transparent overlay — intercepts right-click, long-press, drag */
        .photo-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Error state */
        .photo-error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            letter-spacing: 0.18em;
            color: rgba(184, 197, 214, 0.65);
            font-weight: 300;
            z-index: 3;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 12px 0;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            text-align: center;
            text-decoration: none;
            border: 1px solid rgba(43, 43, 43, 0.18);
            color: rgba(43, 43, 43, 0.6);
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans JP', sans-serif;
            background: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-download:hover {
            border-color: rgba(43, 43, 43, 0.4);
            color: rgba(43, 43, 43, 0.88);
            background: rgba(43, 43, 43, 0.04);
        }
        .btn-download:active { transform: scale(0.98); }
        .btn-download:disabled {
            opacity: 0.45;
            cursor: default;
            transform: none;
        }

        /* Download progress bar */
        .dl-progress-wrap {
            display: none;
        }
        .dl-progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(43, 43, 43, 0.07);
            border-radius: 1px;
            overflow: hidden;
        }
        .dl-progress-fill {
            height: 100%;
            width: 0%;
            background: rgba(43, 43, 43, 0.38);
            border-radius: 1px;
            transition: width 0.12s ease;
        }
        @keyframes dlSweep {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .dl-progress-fill.indeterminate {
            width: 100%;
            transition: none;
            background: linear-gradient(
                90deg,
                rgba(43,43,43,0.04) 0%,
                rgba(43,43,43,0.32) 50%,
                rgba(43,43,43,0.04) 100%
            );
            background-size: 200% 100%;
            animation: dlSweep 1.4s ease infinite;
        }
        .dl-progress-text {
            font-size: 0.5rem;
            letter-spacing: 0.22em;
            color: rgba(184, 197, 214, 0.75);
            text-align: center;
            display: block;
            margin-top: 5px;
        }

        /* Mobile hint — only shown on touch devices without Web Share API */
        .mobile-hint {
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            color: rgba(184, 197, 214, 0.7);
            text-align: center;
            line-height: 1.7;
            display: none;
            padding: 0 4px;
        }
        @media (pointer: coarse) {
            .mobile-hint { display: block; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim { animation: fadeUp 0.9s ease forwards; opacity: 0; }
        .d1 { animation-delay: 0.1s; }
        .d2 { animation-delay: 0.3s; }
        .d3 { animation-delay: 0.5s; }

        /* ── Structural layout ── */
        .frame-corner.tl { top: 0; left: 0; }
        .frame-wrapper { position: fixed; inset: 20px; pointer-events: none; z-index: 5; }
        .side-left  { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 5; }
        .side-right { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 5; }
        .dl-card    { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 20px; }

        /* ── Decorative components ── */
        .deco-top-row { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .deco-line    { width: 36px; height: 1px; background: rgba(184,197,214,0.45); }
        .deco-diamond { width: 5px; height: 5px; border: 1px solid rgba(184,197,214,0.6); transform: rotate(45deg); }
        .dl-actions   { display: flex; flex-direction: column; gap: 12px; }
        .code-row     { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .code-label   { font-size: 0.6rem; letter-spacing: 0.2em; color: rgba(184,197,214,0.65); font-weight: 300; }
        .code-value   { font-family: monospace; font-size: 1.1rem; font-weight: 400; letter-spacing: 0.25em; color: rgba(43,43,43,0.75); user-select: all; }

        /* ── Footer ── */
        .bottom-label { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 10; }
        .bottom-text  { font-size: 0.52rem; letter-spacing: 0.28em; color: rgba(184,197,214,0.5); font-weight: 300; }
    </style>
</head>
<body>

<!-- Frame corner decorations -->
<div class="frame-wrapper">
    <div class="frame-corner tl"></div>
    <div class="frame-corner tr"></div>
    <div class="frame-corner bl"></div>
    <div class="frame-corner br"></div>
</div>

<!-- Vertical side labels -->
<div class="side-left">
    <span class="vert-label" data-i18n="dl.vertLabel">照片取件 · PHOTO PICKUP</span>
</div>
<div class="side-right">
    <span class="vert-label">風嶺 · CCIT</span>
</div>

<!-- Content -->
<div class="dl-card">

    <!-- Top decoration -->
    <div class="anim d1 deco-top-row">
        <div class="deco-line"></div>
        <div class="deco-diamond"></div>
        <div class="deco-line"></div>
    </div>

    <!-- Photo (src set by JS so fetch can add ngrok-skip-browser-warning header) -->
    <div id="photo-wrap" class="photo-wrap anim d2">
        <img id="photo-img"
             class="photo-img"
             data-i18n-alt="dl.photoAlt"
             alt="您的照片"
             draggable="false">
        <div class="photo-overlay"></div>
        <div id="photo-error" class="photo-error" data-i18n="dl.loadError">照片載入失敗，請重新整理</div>
    </div>

    <!-- Code + download -->
    <div class="anim d3 dl-actions">
        <div class="code-row">
            <span class="code-label" data-i18n="dl.code">取件碼</span>
            <span class="code-value">{code}</span>
        </div>
        <button id="btn-dl" class="btn-download" data-i18n="dl.btn">下載照片</button>
        <div id="dl-progress-wrap" class="dl-progress-wrap">
            <div class="dl-progress-bar">
                <div id="dl-progress-fill" class="dl-progress-fill"></div>
            </div>
            <span id="dl-progress-text" class="dl-progress-text"></span>
        </div>
        <p class="mobile-hint" id="mobile-hint" data-i18n="dl.mobileHint">下載後請至「檔案」App 長按照片，選擇「加入照片圖庫」</p>
    </div>

</div>

<!-- Bottom label -->
<div class="bottom-label">
    <span class="bottom-text">
        風嶺拍貼機 · PHOTOBOOTH SYSTEM
    </span>
</div>

<script nonce="__CSP_NONCE__">
    /* ── i18n ── */
    const TRANSLATIONS = {
        'zh-TW': {
            'dl.vertLabel':  '照片取件 · PHOTO PICKUP',
            'dl.photoAlt':   '您的照片',
            'dl.code':       '取件碼',
            'dl.btn':        '下載照片',
            'dl.mobileHint': '下載後請至「檔案」App 長按照片，選擇「加入照片圖庫」',
            'dl.loadError':  '照片載入失敗，請重新整理',
        },
        'en': {
            'dl.vertLabel':  'Photo Pickup · PHOTO PICKUP',
            'dl.photoAlt':   'Your photo',
            'dl.code':       'Pickup Code',
            'dl.btn':        'Download Photo',
            'dl.mobileHint': 'After downloading, long-press the photo in your Files app and choose "Save to Photos".',
            'dl.loadError':  'Failed to load photo, please refresh',
        }
    };
    const _browserLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-TW' : 'en';
    let _lang = localStorage.getItem('pb-lang') || _browserLang;
    function t(key) {
        return (TRANSLATIONS[_lang] || TRANSLATIONS['zh-TW'])[key] || key;
    }
    function applyLang(lang) {
        _lang = lang;
        localStorage.setItem('pb-lang', lang);
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
            el.alt = t(el.dataset.i18nAlt);
        });
    }
    applyLang(_lang);

    /* ── Load preview image via fetch (adds ngrok-skip-browser-warning to bypass ngrok interstitial) ── */
    (function () {
        var img   = document.getElementById('photo-img');
        var errEl = document.getElementById('photo-error');

        /* Detect WebP support to request the right format from the server */
        var _supportsWebP = document.createElement('canvas')
            .toDataURL('image/webp').startsWith('data:image/webp');
        var _accept = _supportsWebP
            ? 'image/webp,image/jpeg,image/*'
            : 'image/jpeg,image/*';

        fetch('/api/photo/{code}/thumb', {
            headers: {
                'Accept': _accept,
                'ngrok-skip-browser-warning': '1',
            }
        })
        .then(function (r) {
            if (!r.ok) throw new Error('status ' + r.status);
            var ct = r.headers.get('content-type') || '';
            if (!ct.startsWith('image/')) throw new Error('unexpected content-type: ' + ct);
            return r.blob();
        })
        .then(function (blob) {
            var url = URL.createObjectURL(blob);
            img.onload  = function () { URL.revokeObjectURL(url); };
            img.onerror = function () { URL.revokeObjectURL(url); errEl.style.display = 'flex'; };
            img.src = url;
        })
        .catch(function () { errEl.style.display = 'flex'; });
    })();

    /* ── Anti-save protections ── */
    document.addEventListener('contextmenu', function (e) {
        if (e.target.closest && e.target.closest('.photo-wrap')) e.preventDefault();
    });
    document.addEventListener('dragstart', function (e) {
        if (e.target.closest && e.target.closest('.photo-wrap')) e.preventDefault();
    });
    document.addEventListener('keydown', function (e) {
        var ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && ['s', 'u', 'p'].includes(e.key.toLowerCase())) e.preventDefault();
    });

    /* ── Download helpers ── */
    function _dlFmtBytes(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    async function _fetchWithProgress(url, onProgress) {
        var resp = await fetch(url, { headers: { 'ngrok-skip-browser-warning': '1' } });
        if (!resp.ok) throw new Error('fetch failed');
        var contentType = resp.headers.get('Content-Type') || 'image/jpeg';
        var contentLength = resp.headers.get('Content-Length');
        var total = contentLength ? parseInt(contentLength, 10) : 0;
        var reader = resp.body.getReader();
        var chunks = [];
        var received = 0;
        while (true) {
            var result = await reader.read();
            if (result.done) break;
            chunks.push(result.value);
            received += result.value.length;
            if (onProgress) onProgress(total > 0 ? received / total : -1, received);
        }
        return new Blob(chunks, { type: contentType });
    }

    /* ── Download button — always fetches full-resolution original ── */
    document.getElementById('btn-dl').addEventListener('click', async function () {
        var btn  = this;
        var orig = btn.textContent;
        var wrap  = document.getElementById('dl-progress-wrap');
        var fill  = document.getElementById('dl-progress-fill');
        var label = document.getElementById('dl-progress-text');

        function setProgress(ratio, received) {
            if (ratio < 0) {
                fill.classList.add('indeterminate');
                label.textContent = _dlFmtBytes(received);
            } else {
                fill.classList.remove('indeterminate');
                var pct = Math.round(ratio * 100);
                fill.style.width = pct + '%';
                label.textContent = pct + '%';
            }
        }

        function resetProgress(delay) {
            setTimeout(function () {
                wrap.style.display = 'none';
                fill.classList.remove('indeterminate');
                fill.style.width = '0%';
                label.textContent = '';
            }, delay);
        }

        btn.disabled = true;
        btn.textContent = '...';
        fill.classList.remove('indeterminate');
        fill.style.width = '0%';
        label.textContent = '0%';
        wrap.style.display = 'block';

        try {
            var blob = await _fetchWithProgress('/api/photo/{code}?dl=1', setProgress);

            /* Show 100% briefly */
            fill.classList.remove('indeterminate');
            fill.style.width = '100%';
            label.textContent = '100%';

            var extMap = { 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' };
            var ext  = extMap[blob.type] || 'jpg';
            var filename = 'photo_{code}.' + ext;

            /* Web Share API — mobile only (pointer: coarse); desktop goes straight to blob download */
            var shared = false;
            var isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
            if (isTouchDevice && navigator.canShare) {
                var file = new File([blob], filename, { type: blob.type });
                if (navigator.canShare({ files: [file] })) {
                    resetProgress(600);
                    btn.textContent = orig;
                    btn.disabled = false;
                    try {
                        await navigator.share({ files: [file] });
                        shared = true;
                    } catch (err) {
                        shared = (err.name === 'AbortError'); /* cancelled = handled */
                    }
                }
            }
            if (shared) return;

            /* Fallback: trigger browser download via blob URL */
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
            resetProgress(800);

        } catch (err) {
            wrap.style.display = 'none';
        } finally {
            btn.textContent = orig;
            btn.disabled = false;
        }
    });

    /* ── Hide mobile hint when Web Share API is available ── */
    (function () {
        var hint = document.getElementById('mobile-hint');
        if (hint && navigator.canShare) hint.style.display = 'none';
    })();
</script>
</body>
</html>
