<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風嶺拍貼機 — 照片取件</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;200;300;400&display=swap">
    <style nonce="__CSP_NONCE__">
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #f5f5f0;
            overflow: hidden;
        }

        /* Corner bracket decoration */
        .frame-corner {
            position: absolute;
            width: 24px;
            height: 24px;
        }
        .frame-corner::before,
        .frame-corner::after {
            content: '';
            position: absolute;
            background: rgba(184, 197, 214, 0.45);
        }
        .frame-corner::before { width: 100%; height: 1px; top: 0; left: 0; }
        .frame-corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
        .frame-corner.tr { transform: rotate(90deg);  top: 0; right: 0; }
        .frame-corner.bl { transform: rotate(270deg); bottom: 0; left: 0; }
        .frame-corner.br { transform: rotate(180deg); bottom: 0; right: 0; }

        .vert-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.58rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(184, 197, 214, 0.6);
        }

        /* Photo canvas wrap */
        .photo-wrap {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        }
        .photo-canvas {
            width: 100%;
            display: block;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            touch-action: none;
        }
        /* Transparent overlay — intercepts right-click, long-press, drag */
        .photo-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 12px 0;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            text-align: center;
            text-decoration: none;
            border: 1px solid rgba(43, 43, 43, 0.18);
            color: rgba(43, 43, 43, 0.6);
            border-radius: 2px;
            transition: all 0.3s ease;
            font-family: 'Noto Sans JP', sans-serif;
            background: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-download:hover {
            border-color: rgba(43, 43, 43, 0.4);
            color: rgba(43, 43, 43, 0.88);
            background: rgba(43, 43, 43, 0.04);
        }
        .btn-download:active { transform: scale(0.98); }
        .btn-download:disabled {
            opacity: 0.45;
            cursor: default;
            transform: none;
        }

        /* Mobile hint — only shown on touch devices without Web Share API */
        .mobile-hint {
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            color: rgba(184, 197, 214, 0.7);
            text-align: center;
            line-height: 1.7;
            display: none;
            padding: 0 4px;
        }
        @media (pointer: coarse) {
            .mobile-hint { display: block; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim { animation: fadeUp 0.9s ease forwards; opacity: 0; }
        .d1 { animation-delay: 0.1s; }
        .d2 { animation-delay: 0.3s; }
        .d3 { animation-delay: 0.5s; }
    </style>
</head>
<body>

<!-- Frame corner decorations -->
<div style="position:fixed; inset:20px; pointer-events:none; z-index:5;">
    <div class="frame-corner" style="top:0;left:0;"></div>
    <div class="frame-corner tr"></div>
    <div class="frame-corner bl"></div>
    <div class="frame-corner br"></div>
</div>

<!-- Vertical side labels -->
<div style="position:fixed; left:20px; top:50%; transform:translateY(-50%); pointer-events:none; z-index:5;">
    <span class="vert-label" data-i18n="dl.vertLabel">照片取件 · PHOTO PICKUP</span>
</div>
<div style="position:fixed; right:20px; top:50%; transform:translateY(-50%); pointer-events:none; z-index:5;">
    <span class="vert-label">風嶺 · CCIT</span>
</div>

<!-- Content -->
<div style="width:100%; max-width:320px; display:flex; flex-direction:column; gap:20px;">

    <!-- Top decoration -->
    <div class="anim d1" style="display:flex; align-items:center; gap:12px; justify-content:center;">
        <div style="width:36px; height:1px; background:rgba(184,197,214,0.45);"></div>
        <div style="width:5px; height:5px; border:1px solid rgba(184,197,214,0.6); transform:rotate(45deg);"></div>
        <div style="width:36px; height:1px; background:rgba(184,197,214,0.45);"></div>
    </div>

    <!-- Photo (canvas — no direct save possible) -->
    <div class="photo-wrap anim d2">
        <canvas id="photo-canvas" class="photo-canvas" data-i18n-aria="dl.photoAlt" aria-label="您的照片"></canvas>
        <div class="photo-overlay"></div>
    </div>

    <!-- Code + download -->
    <div class="anim d3" style="display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
            <span style="font-size:0.6rem; letter-spacing:0.2em; color:rgba(184,197,214,0.65); font-weight:300;"
                  data-i18n="dl.code">取件碼</span>
            <span style="font-family:monospace; font-size:1.1rem; font-weight:400; letter-spacing:0.25em;
                         color:rgba(43,43,43,0.75); user-select:all;">{code}</span>
        </div>
        <button id="btn-dl" class="btn-download" data-i18n="dl.btn">下載照片</button>
        <p class="mobile-hint" id="mobile-hint" data-i18n="dl.mobileHint">下載後請至「檔案」App 長按照片，選擇「加入照片圖庫」</p>
    </div>

</div>

<!-- Bottom label -->
<div style="position:fixed; bottom:20px; left:0; right:0; text-align:center; pointer-events:none; z-index:10;">
    <span style="font-size:0.52rem; letter-spacing:0.28em; color:rgba(184,197,214,0.5); font-weight:300;">
        風嶺拍貼機 · PHOTOBOOTH SYSTEM
    </span>
</div>

<script nonce="__CSP_NONCE__">
    /* ── i18n ── */
    const TRANSLATIONS = {
        'zh-TW': {
            'dl.vertLabel':  '照片取件 · PHOTO PICKUP',
            'dl.photoAlt':   '您的照片',
            'dl.code':       '取件碼',
            'dl.btn':        '下載照片',
            'dl.mobileHint': '下載後請至「檔案」App 長按照片，選擇「加入照片圖庫」',
        },
        'en': {
            'dl.vertLabel':  'Photo Pickup · PHOTO PICKUP',
            'dl.photoAlt':   'Your photo',
            'dl.code':       'Pickup Code',
            'dl.btn':        'Download Photo',
            'dl.mobileHint': 'After downloading, long-press the photo in your Files app and choose "Save to Photos".',
        }
    };
    const _browserLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-TW' : 'en';
    let _lang = localStorage.getItem('pb-lang') || _browserLang;
    function t(key) {
        return (TRANSLATIONS[_lang] || TRANSLATIONS['zh-TW'])[key] || key;
    }
    function applyLang(lang) {
        _lang = lang;
        localStorage.setItem('pb-lang', lang);
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
            el.alt = t(el.dataset.i18nAlt);
        });
        var canvas = document.getElementById('photo-canvas');
        if (canvas) canvas.setAttribute('aria-label', t('dl.photoAlt'));
    }
    applyLang(_lang);

    /* ── Load thumbnail to canvas (WebP 480px, saves bandwidth) ── */
    (function () {
        var canvas = document.getElementById('photo-canvas');
        var ctx = canvas.getContext('2d');
        fetch('/api/photo/{code}/thumb')
            .then(function (r) { return r.ok ? r.blob() : Promise.reject(); })
            .then(function (blob) {
                var url = URL.createObjectURL(blob);
                var img = new Image();
                img.onload = function () {
                    canvas.width  = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                };
                img.onerror = function () { URL.revokeObjectURL(url); };
                img.src = url;
            })
            .catch(function () {});
    })();

    /* ── Anti-save protections ── */
    document.addEventListener('contextmenu', function (e) {
        if (e.target.closest && e.target.closest('.photo-wrap')) e.preventDefault();
    });
    document.addEventListener('dragstart', function (e) {
        if (e.target.closest && e.target.closest('.photo-wrap')) e.preventDefault();
    });
    document.addEventListener('keydown', function (e) {
        var ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && ['s', 'u', 'p'].includes(e.key.toLowerCase())) e.preventDefault();
    });

    /* ── Download button — always fetches full-resolution original ── */
    document.getElementById('btn-dl').addEventListener('click', async function () {
        var btn = this;
        var origText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '...';
        try {
            var resp = await fetch('/api/photo/{code}?dl=1');
            if (!resp.ok) throw new Error('fetch failed');
            var blob = await resp.blob();
            var extMap = { 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' };
            var ext = extMap[blob.type] || 'jpg';
            var filename = 'photo_{code}.' + ext;

            /* Web Share API — on iOS 15+ / Android 86+ lets the user save directly to Photos */
            if (navigator.canShare) {
                var file = new File([blob], filename, { type: blob.type });
                if (navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file] });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return; /* user cancelled */
                        /* Other error: fall through to blob download */
                    }
                }
            }

            /* Fallback: trigger browser download via blob URL */
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 5000);

        } catch (err) {
            /* silently fail */
        } finally {
            btn.textContent = origText;
            btn.disabled = false;
        }
    });

    /* ── Hide mobile hint when Web Share API is available ── */
    (function () {
        var hint = document.getElementById('mobile-hint');
        if (hint && navigator.canShare) hint.style.display = 'none';
    })();
</script>
</body>
</html>
