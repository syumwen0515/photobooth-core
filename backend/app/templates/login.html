<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風嶺拍貼機 — 管理員登入</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"
            integrity="sha384-LEhCeSYMzzIZgXNDqOnt039uBFADh2Yf9gaWTpae2Da9UHXEkW6C95emO9aEKIlp"
            crossorigin="anonymous"></script>
    <style nonce="__CSP_NONCE__">
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;200;300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #f5f5f0;
            overflow: hidden;
        }

        /* Corner bracket decoration */
        .frame-corner {
            position: absolute;
            width: 24px;
            height: 24px;
        }
        .frame-corner::before,
        .frame-corner::after {
            content: '';
            position: absolute;
            background: rgba(184, 197, 214, 0.45);
        }
        .frame-corner::before { width: 100%; height: 1px; top: 0; left: 0; }
        .frame-corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
        .frame-corner.tl { top: 0; left: 0; }
        .frame-corner.tr { transform: rotate(90deg);  top: 0; right: 0; }
        .frame-corner.bl { transform: rotate(270deg); bottom: 0; left: 0; }
        .frame-corner.br { transform: rotate(180deg); bottom: 0; right: 0; }

        .vert-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.58rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: rgba(184, 197, 214, 0.6);
        }

        .wa-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid rgba(184, 197, 214, 0.4);
            border-radius: 3px;
            padding: 0.625rem 0.75rem;
            font-size: 0.78rem;
            font-weight: 300;
            font-family: 'Noto Sans JP', sans-serif;
            color: #2b2b2b;
            transition: border-color 0.2s;
            outline: none;
        }
        .wa-input:focus { border-color: rgba(184, 197, 214, 0.7); }
        .wa-input::placeholder { color: rgba(184, 197, 214, 0.55); }

        .btn-login {
            display: block;
            width: 100%;
            padding: 11px 0;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            border: 1px solid rgba(43, 43, 43, 0.18);
            color: rgba(43, 43, 43, 0.6);
            border-radius: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: transparent;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .btn-login:hover {
            border-color: rgba(43, 43, 43, 0.4);
            color: rgba(43, 43, 43, 0.88);
            background: rgba(43, 43, 43, 0.04);
        }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .wa-back-link {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            color: rgba(184, 197, 214, 0.65);
            font-weight: 300;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .wa-back-link:hover { opacity: 0.7; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim { animation: fadeUp 1s ease forwards; opacity: 0; }
        .d1 { animation-delay: 0.1s; }
        .d2 { animation-delay: 0.3s; }
        .d3 { animation-delay: 0.5s; }
        .d4 { animation-delay: 0.72s; }

        /* ── Structural layout ── */
        .frame-wrapper { position: fixed; inset: 20px; pointer-events: none; z-index: 5; }
        .side-left  { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 5; }
        .side-right { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 5; }
        .login-card { width: 100%; max-width: 288px; }

        /* ── Decorative components ── */
        .deco-top-row    { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
        .deco-line       { width: 36px; height: 1px; background: rgba(184,197,214,0.45); }
        .deco-diamond    { width: 5px; height: 5px; border: 1px solid rgba(184,197,214,0.6); transform: rotate(45deg); }
        .brand-block     { text-align: center; margin-bottom: 32px; }
        .brand-title     { font-size: clamp(1.6rem,6vw,2.4rem); font-weight: 100; letter-spacing: 0.4em; text-indent: 0.4em; color: #2b2b2b; line-height: 1; }
        .brand-deco-col  { display: flex; flex-direction: column; align-items: center; margin-top: 14px; }
        .deco-line-v-top { width: 1px; height: 20px; background: linear-gradient(to bottom, rgba(184,197,214,0.45), rgba(184,197,214,0.1)); }
        .brand-tagline   { font-size: 0.58rem; letter-spacing: 0.4em; text-indent: 0.4em; color: rgba(184,197,214,0.7); font-weight: 300; margin: 8px 0; }
        .deco-line-v-bot { width: 1px; height: 20px; background: linear-gradient(to bottom, rgba(184,197,214,0.1), transparent); }

        /* ── Form ── */
        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .form-label { display: block; font-size: 0.65rem; color: rgba(43,43,43,0.5); font-weight: 300; letter-spacing: 0.12em; margin-bottom: 7px; }
        .error-msg  { display: none; text-align: center; font-size: 0.65rem; color: rgba(220,60,60,0.75); font-weight: 300; }
        .submit-row { padding-top: 4px; }
        .back-row   { text-align: right; margin-top: 20px; }

        /* ── Footer ── */
        .bottom-label { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 10; }
        .bottom-text  { font-size: 0.52rem; letter-spacing: 0.28em; color: rgba(184,197,214,0.5); font-weight: 300; }
    </style>
</head>
<body>

<!-- Frame corner decorations -->
<div class="frame-wrapper">
    <div class="frame-corner tl"></div>
    <div class="frame-corner tr"></div>
    <div class="frame-corner bl"></div>
    <div class="frame-corner br"></div>
</div>

<!-- Vertical side labels -->
<div class="side-left">
    <span class="vert-label" data-i18n="vert.login">管理員登入 · LOGIN</span>
</div>
<div class="side-right">
    <span class="vert-label">風嶺 · CCIT</span>
</div>

<!-- Login card -->
<div class="login-card">

    <!-- Top decoration -->
    <div class="anim d1 deco-top-row">
        <div class="deco-line"></div>
        <div class="deco-diamond"></div>
        <div class="deco-line"></div>
    </div>

    <!-- Brand title -->
    <div class="anim d2 brand-block">
        <div class="brand-title">
            風嶺
        </div>
        <div class="brand-deco-col">
            <div class="deco-line-v-top"></div>
            <span class="brand-tagline">ADMIN · LOGIN</span>
            <div class="deco-line-v-bot"></div>
        </div>
    </div>

    <!-- Form (no method/action — JS handles submission via axios JSON POST) -->
    <form id="loginForm" class="anim d3 login-form" autocomplete="on">
        <div>
            <label for="username" class="form-label" data-i18n="login.username">帳號</label>
            <input type="text" id="username" name="username" required autocomplete="username"
                   class="wa-input">
        </div>
        <div>
            <label for="password" class="form-label" data-i18n="login.password">密碼</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   class="wa-input">
        </div>

        <p id="errorMsg" class="error-msg"></p>

        <div class="anim d4 submit-row">
            <button type="submit" id="loginBtn" class="btn-login" data-i18n="login.btn">登入</button>
        </div>
    </form>

    <div class="anim d4 back-row">
        <a href="/" class="wa-back-link" data-i18n="login.back">← 首頁</a>
    </div>

</div>

<!-- Bottom label -->
<div class="bottom-label">
    <span class="bottom-text">
        風嶺拍貼機 · PHOTOBOOTH SYSTEM
    </span>
</div>

<script nonce="__CSP_NONCE__">
    /* ── i18n ── */
    const TRANSLATIONS = {
        'zh-TW': {
            'vert.login':     '管理員登入 · LOGIN',
            'login.username': '帳號',
            'login.password': '密碼',
            'login.btn':      '登入',
            'login.loading':  '登入中...',
            'login.back':     '← 首頁',
            'login.error':    '登入失敗，請確認帳號密碼',
        },
        'en': {
            'vert.login':     'Admin · LOGIN',
            'login.username': 'Username',
            'login.password': 'Password',
            'login.btn':      'Sign In',
            'login.loading':  'Signing in...',
            'login.back':     '← Home',
            'login.error':    'Login failed. Please check your credentials.',
        }
    };
    const _browserLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-TW' : 'en';
    let _lang = localStorage.getItem('pb-lang') || _browserLang;
    function t(key) {
        return (TRANSLATIONS[_lang] || TRANSLATIONS['zh-TW'])[key] || key;
    }
    function applyLang(lang) {
        _lang = lang;
        localStorage.setItem('pb-lang', lang);
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
    }
    applyLang(_lang);

    /* ── Login form ── */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn      = document.getElementById('loginBtn');
        const errMsg   = document.getElementById('errorMsg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled    = true;
        btn.textContent = t('login.loading');
        errMsg.style.display = 'none';

        try {
            await axios.post('/api/auth/login', { username, password });
            window.location.href = '/admin';
        } catch (err) {
            errMsg.textContent   = err.response?.data?.detail || t('login.error');
            errMsg.style.display = 'block';
        } finally {
            btn.disabled    = false;
            btn.textContent = t('login.btn');
        }
    });
</script>
</body>
</html>
