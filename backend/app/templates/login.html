<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風嶺拍貼機 — 管理員登入</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wa-cream': '#f5f5f0',
                        'wa-gray': '#2b2b2b',
                        'wa-light': '#e8e8e3',
                        'wa-blue': '#b8c5d6',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-wa-cream text-wa-gray min-h-screen flex items-center justify-center px-4">

<a href="/" class="fixed top-4 left-4 text-xs text-wa-blue font-light hover:underline underline-offset-2">← 返回首頁</a>

<div class="w-full max-w-sm">
    <div class="text-center mb-10">
        <h1 class="text-2xl font-light tracking-wide text-wa-gray mt-4">管理員登入</h1>
        <div class="mt-3 h-px w-10 bg-wa-blue mx-auto opacity-60"></div>
    </div>

    <form id="loginForm" class="space-y-4" autocomplete="on">
        <div>
            <label class="block text-xs text-wa-blue font-light mb-1.5" for="username">帳號</label>
            <input type="text" id="username" name="username" required autocomplete="username"
                   class="w-full border border-wa-light rounded px-3 py-2.5 text-sm font-light bg-white text-wa-gray focus:outline-none focus:border-wa-blue transition-colors">
        </div>
        <div>
            <label class="block text-xs text-wa-blue font-light mb-1.5" for="password">密碼</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   class="w-full border border-wa-light rounded px-3 py-2.5 text-sm font-light bg-white text-wa-gray focus:outline-none focus:border-wa-blue transition-colors">
        </div>

        <p id="errorMsg" class="hidden text-xs text-red-400 font-light text-center py-0.5"></p>

        <button type="submit" id="loginBtn"
                class="w-full py-3 mt-1 bg-wa-blue text-white text-sm font-light rounded transition-all hover:bg-wa-blue/90 active:scale-[0.98] disabled:opacity-50">
            登入
        </button>
    </form>

</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errMsg = document.getElementById('errorMsg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = '登入中...';
        errMsg.classList.add('hidden');

        try {
            await axios.post('/api/auth/login', { username, password });
            window.location.href = '/admin';
        } catch (err) {
            errMsg.textContent = err.response?.data?.detail || '登入失敗，請確認帳號密碼';
            errMsg.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = '登入';
        }
    });
</script>
</body>
</html>
